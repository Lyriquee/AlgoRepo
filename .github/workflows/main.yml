# ============================================================
# AlgoRepo 持续集成 (CI) 工作流
# ============================================================
# 触发条件：
#   - 向 master 分支推送代码
#   - 向 master 分支发起 Pull Request
# 任务内容：
#   1. 在 Ubuntu 最新环境下编译项目
#   2. 运行全部单元测试（基于 Unity 框架）
# ============================================================

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# 全局环境变量
env:
  BUILD_TYPE: Debug

jobs:
  # ----------------------------------------------------------
  # 任务：编译与单元测试
  # ----------------------------------------------------------
  build-and-test:
    name: "编译 & 单元测试"
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装基础构建工具（Ubuntu 已自带 gcc, make 等）
      #    CMake 需要手动安装，以确保版本较新
      - name: 安装 CMake
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake

      # 3. 配置 CMake 构建系统
      #    这里指定源代码目录为当前目录，构建目录为 build
      #    打开 CMake 的测试选项（用于 CTest）
      - name: 配置 CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_TESTING=ON

      # 4. 编译项目
      - name: 编译
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      # 5. 运行测试（通过 CTest 执行，自动发现并运行所有注册的测试）
      - name: 运行单元测试
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
